# Podgląd na telefon (7.7): po każdym pushu na main GitHub buduje program w trybie tylko do czytania (VITE_PODGLAD=1)
# i publikuje go na GitHub Pages: https://erlethaden.github.io/Fantasy_RP/  — instrukcja: INSTRUKCJA-TELEFON.md
name: Podgląd na telefon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # Electron niepotrzebny do strony
      - run: npx vite build
        env:
          VITE_PODGLAD: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - id: publikacja
        uses: actions/deploy-pages@v4
