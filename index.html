<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasy RP dla autystów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
</head><body>
<div id="menu">
<canvas id="scena"></canvas>
<div class="cien"></div>

<h1>Fantasy RP <br>dla autystów</h1>
<p class="pod">Sala Tronów — zaloguj się, by wejść do gry</p>
<form class="panel" id="logowanie" autocomplete="off">
  <div class="aktualizacja" id="aktualizacja" role="status" hidden></div>
  <label for="mail">E-mail</label><input id="mail" type="email" autocomplete="off" readonly placeholder="E-mail">
  <label for="haslo">Hasło</label><input id="haslo" type="password" autocomplete="off" readonly placeholder="Hasło">
  <p class="blad" id="blad-logowania" role="alert" hidden></p>
  <button class="wejdz" type="submit">Wejdź do sali</button>
  <button class="google" type="button" id="zaloz-konto" hidden>Załóż konto</button>
  <div class="lub">albo</div>
  <button class="google" type="button" id="google">Zaloguj przez Google</button>
  <div class="wersja"><span id="wersja"></span><button type="button" class="pokaz-zmiany" id="pokaz-zmiany">Co nowego</button><span id="tryb">tryb DEMO</span></div>
</form>

<div class="podpis"><div class="imie" id="imie"></div><div class="frakcja" id="frakcja"></div></div>
<div class="miniatury" id="miniatury"></div>
</div>

<div id="aplikacja" hidden>
  <header class="gora">
    <div class="tytul">Fantasy RP <span>dla autystów</span></div>
    <nav class="frakcje" id="lista-frakcji" aria-label="Frakcje"></nav>
    <div class="konto"><span id="konto-mail">tryb DEMO</span> <button type="button" id="dzwieki-przycisk" title="Dźwięki" aria-label="Ustawienia dźwięków">🔊</button><div class="dzwieki-panel" id="dzwieki-panel" hidden></div> <button type="button" id="samouczek-przycisk" title="Zgrzyt pokaże, co gdzie jest">Samouczek</button> <button type="button" id="bloki">Bloki</button> <button type="button" id="kronika">Kronika</button> <button type="button" id="panel-gm">Panel GM</button> <button type="button" id="wyjdz">Sala Tronów</button> <button type="button" id="wyloguj" hidden>Wyloguj</button></div>
  </header>
  <div class="obszar">
    <main class="mapa" id="mapa" aria-label="Mapa świata — przeciągnij, by przesunąć; kółko albo +/- przybliża"></main>
    <div class="warstwy-mapy" id="warstwy-mapy" role="group" aria-label="Warstwy mapy"></div>
    <div class="szukaj-mapy"><input type="search" id="szukaj" list="lista-szukaj" placeholder="🔍 Szukaj prowincji, osady, akwenu…" aria-label="Szukaj prowincji, osady albo akwenu" autocomplete="off"><datalist id="lista-szukaj"></datalist></div>
    <aside class="szuflada" id="szuflada" hidden>
      <button type="button" class="zamknij zamknij-szuflade" id="zamknij-szuflade" aria-label="Zamknij panel">×</button>
      <div class="glowny" id="glowny"></div>
    </aside>
  </div>
  <dialog class="okno" id="bohater" aria-label="Bohater"></dialog>
  <dialog class="okno okno-bitwy" id="bitwa" aria-label="Bitwa"></dialog>
  <dialog class="okno okno-timelapse" id="timelapse" aria-label="Historia gry — timelapse"></dialog>
  <dialog class="okno okno-grafiki" id="grafika" aria-label="Grafika krainy"></dialog>
  <dialog class="okno okno-opowiesci" id="opowiesc" aria-label="Kronika Zgrzyta"></dialog>
</div>
<dialog class="okno zmiany" id="zmiany" aria-label="Co nowego"></dialog>
<div class="nakladka" id="nakladka-aktualizacji" role="alertdialog" aria-modal="true" aria-labelledby="nakladka-tytul" hidden>
  <div class="nakladka-okno"><h2 id="nakladka-tytul">Nowa wersja programu</h2><div id="nakladka-tresc"></div></div>
</div>
<script type="module" src="/src/main.js"></script>
</body></html>
