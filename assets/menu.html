<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala Tronów — menu główne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--zloto:#d9b25a;--zloto2:#8a6a2a;--tekst:#efe3c8;--tlo:#0b0c12;--mini:clamp(60px,6.4vw,124px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--tlo);color:var(--tekst);font:16px/1.5 Spectral,Georgia,serif}
#scena{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.cien{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,5,10,.6),rgba(5,5,10,.2) 32%,rgba(5,5,10,0) 46%),radial-gradient(ellipse at 16% 55%,rgba(5,5,10,.85),rgba(5,5,10,.35) 42%,rgba(5,5,10,0) 66%),linear-gradient(0deg,rgba(5,5,10,.85),rgba(5,5,10,0) 26%)}
h1{position:fixed;z-index:2;left:6vw;top:9vh;margin:0;font:900 clamp(36px,3.8vw,64px)/1 Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--zloto);text-shadow:0 4px 0 #3a2a0a,0 0 30px rgba(0,0,0,.9)}
.pod{position:fixed;z-index:2;left:6vw;top:calc(9vh + clamp(36px,3.8vw,64px)*2 + 12px);margin:0;font-size:16px;letter-spacing:.08em;color:#e6d6ae;text-shadow:0 1px 0 #000,0 0 12px #000}
.panel{position:fixed;z-index:2;left:6vw;bottom:7vh;width:min(340px,86vw)}
label{display:block;font-size:13px;color:#bfae86;margin:12px 0 4px}
input{width:100%;padding:10px 12px;background:rgba(5,5,10,.7);border:1px solid var(--zloto2);color:var(--tekst);font:inherit}
input:focus{outline:2px solid var(--zloto);outline-offset:1px}
button{font:600 15px Cinzel,Georgia,serif;letter-spacing:.06em;cursor:pointer}
.wejdz{width:100%;margin-top:20px;padding:12px;background:linear-gradient(#e2bd66,#a77d2e);border:1px solid #000;color:#1a1206;box-shadow:inset 0 1px 0 #fff3c4}
.wejdz:hover{filter:brightness(1.1)}
.lub{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:12px;color:#8f8268}.lub::before,.lub::after{content:"";flex:1;border-top:1px solid #4a3c1e}
.google{width:100%;margin-top:14px;padding:11px;background:#07080d;border:1px solid var(--zloto2);color:var(--tekst)}
.google:hover{border-color:var(--zloto)}
.wersja{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:#8f8268}
.podpis{position:fixed;z-index:2;right:3vw;bottom:calc(4vh + var(--mini)*0.5625 + 22px);text-align:right;text-shadow:0 2px 6px #000,0 0 2px #000;transition:opacity .5s}
.podpis .imie{font:700 clamp(22px,2.6vw,40px)/1.1 Cinzel,Georgia,serif;color:var(--zloto)}
.podpis .frakcja{font-size:clamp(14px,1.2vw,18px)}
.miniatury{display:flex;position:fixed;z-index:2;right:3vw;bottom:4vh;gap:9px}
.miniatury button{padding:0;width:var(--mini);aspect-ratio:16/9;border:2px solid #3a3020;background:#000 center/cover no-repeat;image-rendering:pixelated;opacity:.55;transition:opacity .3s,transform .3s}
.miniatury button.akt,.miniatury button:hover{opacity:1;border-color:var(--zloto);transform:translateY(-4px)}
/* pasek podglądu (tylko na czas oceny) */
.narzedzia{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(5,5,10,.75);padding:6px;border:1px solid var(--zloto2)}
.narzedzia button{padding:5px 10px;background:transparent;border:1px solid #4a3c1e;color:var(--tekst);font-size:12px}
.ukryj .narzedzia{display:none}
@media (max-width:700px){.miniatury,.podpis{display:none}}
</style></head><body>
<canvas id="scena"></canvas>
<div class="cien"></div>

<h1>Fantasy RP <br>dla autystów</h1>
<p class="pod">Sala Tronów — zaloguj się, by wejść do gry</p>
<form class="panel" onsubmit="return false">
  <label for="mail">E-mail</label><input id="mail" type="email" autocomplete="username" placeholder="E-mail">
  <label for="haslo">Hasło</label><input id="haslo" type="password" autocomplete="current-password" placeholder="Hasło">
  <button class="wejdz" type="submit">Wejdź do sali</button>
  <div class="lub">albo</div>
  <button class="google" type="button">Zaloguj przez Google</button>
  <div class="wersja"><span>wersja 0.1.0 (podgląd)</span><span>✔ aktualna</span></div>
</form>

<div class="podpis"><div class="imie" id="imie"></div><div class="frakcja" id="frakcja"></div></div>
<div class="miniatury" id="miniatury"></div>

<div class="narzedzia">
  <button id="anim" type="button">Animacje: wł.</button>
  <button id="pauza" type="button">Pauza</button>
  <button id="pelny" type="button">Pełny ekran (F)</button>
  <button id="schowaj" type="button">Schowaj pasek (H)</button>
</div>

<script src="sala_tronow/animacje.js"></script>
<script>
const CZAS_SCENY = 12000;
const sala = new Sala(document.getElementById("scena"), "sala_tronow/");
Object.assign(sala, { tryb: "blysk", zoom: true, ruch: !matchMedia("(prefers-reduced-motion: reduce)").matches });
const mini = document.getElementById("miniatury");
sala.sceny.forEach((s, i) => {
  const m = document.createElement("button"); m.type = "button"; m.title = s.imie;
  m.style.backgroundImage = `url("sala_tronow/${s.plik}")`; m.onclick = () => { pokaz(i); restart(); }; mini.appendChild(m);
});
let timer = null, pauza = false, podpisTimer;
function pokaz(i) {
  const pierwsza = sala.nr < 0; sala.pokaz(i); const s = sala.sceny[sala.nr], podpis = document.querySelector(".podpis");
  // podpis gaśnie i wraca w połowie przejścia, żeby nie wyprzedzał obrazu
  podpis.style.opacity = 0; clearTimeout(podpisTimer);
  podpisTimer = setTimeout(() => {
    document.getElementById("imie").textContent = s.imie;
    document.getElementById("frakcja").textContent = s.frakcja; podpis.style.opacity = 1;
  }, pierwsza ? 0 : sala.czasPrzejscia * 500);
  [...mini.children].forEach((b, j) => b.classList.toggle("akt", j === sala.nr));
}
function restart() { clearInterval(timer); if (!pauza) timer = setInterval(() => pokaz(sala.nr + 1), CZAS_SCENY); }
const anim = document.getElementById("anim");
const animTekst = () => anim.textContent = "Animacje: " + (sala.ruch ? "wł." : "wył.");
anim.onclick = () => { sala.ruch = !sala.ruch; animTekst(); }; animTekst();
document.getElementById("pauza").onclick = e => { pauza = !pauza; e.target.textContent = pauza ? "Wznów" : "Pauza"; restart(); };
const pelny = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById("pelny").onclick = pelny;
const schowaj = () => document.body.classList.toggle("ukryj");
document.getElementById("schowaj").onclick = schowaj;
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toUpperCase();
  if (k === "F") pelny();
  if (k === "H") schowaj();
  if (e.key === "ArrowRight") { pokaz(sala.nr + 1); restart(); }
  if (e.key === "ArrowLeft") { pokaz(sala.nr - 1); restart(); }
});
// ?nagranie: tryb do nagrania GIF-a / zrzutów (sterowany z zewnątrz przez window.nagranie)
if (new URLSearchParams(location.search).has("nagranie")) {
  sala.reczny = true; document.body.classList.add("ukryj");
  window.nagranie = { krok: dt => sala.krok(dt), scena: i => { pokaz(i); clearInterval(timer); sala.sceny[sala.nr].gestOd = sala.t + 1.2; } };
}
pokaz(0);
if (!sala.reczny) restart();
</script>
</body></html>
